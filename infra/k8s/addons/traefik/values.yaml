deployment:
  replicas: 2

ingressClass:
  enabled: true
  # Application Ingress resources must opt in with:
  # spec.ingressClassName: traefik
  isDefaultClass: false

providers:
  kubernetesIngress:
    enabled: true

service:
  spec:
    type: LoadBalancer
    # This class is provided by the AWS Load Balancer Controller.
    loadBalancerClass: service.k8s.aws/nlb
  annotations:
    # The controller discovers aws_subnet.public from its role/elb tags.
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-name: "gamehub-traefik"
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
