replicaCount: 2

image:
  repository: "{{ ECR_REGISTRY }}/gamehub"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: traefik
  # Leave host empty to serve the app through Traefik's NLB hostname.
  host: ""
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
